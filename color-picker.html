<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RFGFBWNKDE"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RFGFBWNKDE');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker — ToolZone</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#2a2a3a;--accent:#00e5ff;--text:#e8e8f0;--muted:#6b6b80;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  nav{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 2rem;border-bottom:1px solid var(--border);}
  nav a{color:var(--accent);text-decoration:none;font-family:'Space Mono',monospace;font-size:0.85rem;}
  nav .logo{font-family:'Space Mono',monospace;font-weight:700;font-size:1.1rem;color:var(--text);}
  nav .logo span{color:var(--accent);}
  .container{max-width:750px;margin:0 auto;padding:3rem 1.5rem;}
  h1{font-family:'Space Mono',monospace;font-size:2rem;margin-bottom:0.5rem;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:2.5rem;}
  .picker-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2rem;margin-bottom:1.5rem;}
  .color-preview{width:100%;height:120px;border-radius:8px;margin-bottom:1.5rem;transition:background 0.2s;cursor:pointer;border:2px solid var(--border);}
  input[type=color]{width:100%;height:60px;border:none;border-radius:8px;cursor:pointer;background:none;padding:0;}
  .formats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;margin-top:1.5rem;}
  @media(max-width:500px){.formats{grid-template-columns:1fr 1fr;}}
  .format-box{background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:0.75rem;cursor:pointer;transition:border-color 0.2s;}
  .format-box:hover{border-color:var(--accent);}
  .format-box .label{font-size:0.7rem;color:var(--muted);font-family:'Space Mono',monospace;text-transform:uppercase;margin-bottom:0.3rem;}
  .format-box .value{font-family:'Space Mono',monospace;font-size:0.9rem;color:var(--text);}
  .copied{color:var(--accent)!important;}
  .palette-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;}
  .palette-section h3{font-family:'Space Mono',monospace;font-size:0.9rem;color:var(--muted);margin-bottom:1rem;}
  .palette{display:grid;grid-template-columns:repeat(10,1fr);gap:0.4rem;}
  .swatch{height:36px;border-radius:4px;cursor:pointer;transition:transform 0.15s;border:2px solid transparent;}
  .swatch:hover{transform:scale(1.15);border-color:white;}
  .saved-section{margin-top:1rem;}
  .saved-colors{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem;}
  .saved-swatch{width:36px;height:36px;border-radius:6px;cursor:pointer;border:2px solid var(--border);transition:all 0.2s;}
  .saved-swatch:hover{border-color:var(--accent);}
  .btn{padding:0.75rem 1.5rem;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:'Space Mono',monospace;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:1rem;}
  .btn:hover{background:#00c4dd;}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">⚡ Tool<span>Zone</span></a>
  <a href="/">← Back to Tools</a>
</nav>
<div class="container">
  <h1>🎨 Color <span>Picker</span></h1>
  <p class="subtitle">Pick colors and copy HEX, RGB, or HSL values instantly.</p>

  <div class="picker-card">
    <div class="color-preview" id="preview"></div>
    <input type="color" id="colorPicker" value="#00e5ff">
    <div class="formats">
      <div class="format-box" onclick="copyVal('hex')">
        <div class="label">HEX</div>
        <div class="value" id="hexVal">#00e5ff</div>
      </div>
      <div class="format-box" onclick="copyVal('rgb')">
        <div class="label">RGB</div>
        <div class="value" id="rgbVal">rgb(0,229,255)</div>
      </div>
      <div class="format-box" onclick="copyVal('hsl')">
        <div class="label">HSL</div>
        <div class="value" id="hslVal">hsl(187,100%,50%)</div>
      </div>
    </div>
    <button class="btn" id="saveBtn">+ Save Color</button>
  </div>

  <div class="palette-section">
    <h3>QUICK PALETTE — CLICK TO SELECT</h3>
    <div class="palette" id="palette"></div>
    <div class="saved-section">
      <div class="label" style="font-size:0.75rem;color:var(--muted);font-family:'Space Mono',monospace;text-transform:uppercase;">SAVED COLORS</div>
      <div class="saved-colors" id="savedColors"></div>
    </div>
  </div>
</div>

<script>
  const colors=['#ff0000','#ff4400','#ff8800','#ffcc00','#ffff00','#aaff00','#00ff00','#00ff88','#00ffcc','#00ffff','#00ccff','#0088ff','#0044ff','#0000ff','#4400ff','#8800ff','#cc00ff','#ff00ff','#ff0088','#ff0044','#ffffff','#cccccc','#999999','#666666','#333333','#000000','#ff6b6b','#ffd166','#06d6a0','#118ab2','#073b4c','#264653','#2a9d8f','#e9c46a','#f4a261','#e76f51'];
  const palette=document.getElementById('palette');
  colors.forEach(c=>{
    const s=document.createElement('div');s.className='swatch';s.style.background=c;
    s.title=c;s.addEventListener('click',()=>{document.getElementById('colorPicker').value=c;updateColor(c);});
    palette.appendChild(s);
  });

  function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.ctxslice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}
  function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;
    if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
    return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}

  function updateColor(hex){
    document.getElementById('preview').style.background=hex;
    document.getElementById('hexVal').textContent=hex;
    const {r,g,b}=hexToRgb(hex);
    document.getElementById('rgbVal').textContent=`rgb(${r},${g},${b})`;
    const {h,s,l}=rgbToHsl(r,g,b);
    document.getElementById('hslVal').textContent=`hsl(${h},${s}%,${l}%)`;
  }

  function copyVal(type){
    const vals={hex:document.getElementById('hexVal').textContent,rgb:document.getElementById('rgbVal').textContent,hsl:document.getElementById('hslVal').textContent};
    navigator.clipboard.writeText(vals[type]);
    const el=document.getElementById(type+'Val');el.classList.add('copied');el.textContent='Copied!';
    setTimeout(()=>{el.classList.remove('copied');updateColor(document.getElementById('colorPicker').value);},1500);
  }

  document.getElementById('colorPicker').addEventListener('input',e=>updateColor(e.target.value));
  document.getElementById('saveBtn').addEventListener('click',()=>{
    const hex=document.getElementById('colorPicker').value;
    const s=document.createElement('div');s.className='saved-swatch';s.style.background=hex;s.title=hex;
    s.addEventListener('click',()=>{document.getElementById('colorPicker').value=hex;updateColor(hex);});
    document.getElementById('savedColors').appendChild(s);
  });

  updateColor('#00e5ff');
</script>
</body>
</html>

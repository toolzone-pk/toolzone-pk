<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RFGFBWNKDE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RFGFBWNKDE');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — ToolZone</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#13131a;--border:#2a2a3a;--accent:#00e5ff;--accent2:#ff6b35;--green:#00ff88;--text:#e8e8f0;--muted:#6b6b80;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  nav{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 2rem;border-bottom:1px solid var(--border);}
  nav a{color:var(--accent);text-decoration:none;font-family:'Space Mono',monospace;font-size:0.85rem;}
  nav .logo{font-family:'Space Mono',monospace;font-weight:700;font-size:1.1rem;color:var(--text);}
  nav .logo span{color:var(--accent);}
  .container{max-width:650px;margin:0 auto;padding:3rem 1.5rem;}
  h1{font-family:'Space Mono',monospace;font-size:2rem;margin-bottom:0.5rem;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:2.5rem;}
  .password-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;position:relative;}
  .password-display{font-family:'Space Mono',monospace;font-size:1.1rem;word-break:break-all;min-height:2rem;color:var(--green);letter-spacing:0.05em;}
  .copy-btn{position:absolute;top:1rem;right:1rem;background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:all 0.2s;}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent);}
  .strength-bar{height:4px;border-radius:2px;background:var(--border);margin-top:1rem;overflow:hidden;}
  .strength-fill{height:100%;border-radius:2px;transition:all 0.3s;width:0;}
  .strength-label{font-size:0.75rem;color:var(--muted);margin-top:0.4rem;font-family:'Space Mono',monospace;}
  .field{margin-bottom:1.2rem;}
  .field label{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--muted);font-family:'Space Mono',monospace;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.05em;}
  .field label span{color:var(--accent);}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem;}
  .check-item{display:flex;align-items:center;gap:0.6rem;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.75rem;}
  .check-item input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .check-item label{cursor:pointer;font-size:0.9rem;}
  .btn{width:100%;padding:1rem;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.2s;margin-bottom:1rem;}
  .btn:hover{background:#00c4dd;transform:translateY(-1px);}
  .multi-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-top:1rem;}
  .multi-section h3{font-family:'Space Mono',monospace;font-size:0.9rem;margin-bottom:1rem;color:var(--muted);}
  .multi-list{display:flex;flex-direction:column;gap:0.5rem;}
  .multi-item{font-family:'Space Mono',monospace;font-size:0.9rem;color:var(--green);padding:0.5rem;background:#0a0a0f;border-radius:6px;cursor:pointer;transition:background 0.2s;}
  .multi-item:hover{background:#1a1a2a;}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">⚡ Tool<span>Zone</span></a>
  <a href="/">← Back to Tools</a>
</nav>
<div class="container">
  <h1>🔐 Password <span>Generator</span></h1>
  <p class="subtitle">Create strong, secure passwords instantly. Nothing is sent to any server.</p>

  <div class="password-box">
    <div class="password-display" id="passwordDisplay">Click Generate!</div>
    <button class="copy-btn" id="copyBtn">Copy</button>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="strength-label" id="strengthLabel">—</div>
  </div>

  <div class="field">
    <label>Length <span id="lengthVal">16</span></label>
    <input type="range" id="length" min="6" max="64" value="16">
  </div>

  <div class="checks">
    <div class="check-item">
      <input type="checkbox" id="upper" checked>
      <label for="upper">Uppercase (A-Z)</label>
    </div>
    <div class="check-item">
      <input type="checkbox" id="lower" checked>
      <label for="lower">Lowercase (a-z)</label>
    </div>
    <div class="check-item">
      <input type="checkbox" id="numbers" checked>
      <label for="numbers">Numbers (0-9)</label>
    </div>
    <div class="check-item">
      <input type="checkbox" id="symbols" checked>
      <label for="symbols">Symbols (!@#$)</label>
    </div>
  </div>

  <button class="btn" id="generateBtn">🔄 Generate Password</button>
  <button class="btn" style="background:var(--card);color:var(--text);border:1px solid var(--border);" id="multiBtn">Generate 5 Passwords</button>

  <div class="multi-section" id="multiSection" style="display:none;">
    <h3>CLICK ANY TO COPY</h3>
    <div class="multi-list" id="multiList"></div>
  </div>
</div>

<script>
  const upper='ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower='abcdefghijklmnopqrstuvwxyz', nums='0123456789', syms='!@#$%^&*()-_=+[]{}|;:,.<>?';
  const lengthSlider=document.getElementById('length'), lengthVal=document.getElementById('lengthVal');
  lengthSlider.addEventListener('input',()=>{ lengthVal.textContent=lengthSlider.value; generate(); });

  function getChars(){
    let c='';
    if(document.getElementById('upper').checked) c+=upper;
    if(document.getElementById('lower').checked) c+=lower;
    if(document.getElementById('numbers').checked) c+=nums;
    if(document.getElementById('symbols').checked) c+=syms;
    return c||lower;
  }
  function generate(){
    const chars=getChars(), len=parseInt(lengthSlider.value);
    let pwd='';
    for(let i=0;i<len;i++) pwd+=chars[Math.floor(Math.random()*chars.length)];
    document.getElementById('passwordDisplay').textContent=pwd;
    updateStrength(pwd);
    return pwd;
  }
  function updateStrength(pwd){
    let score=0;
    if(pwd.length>=12) score++;
    if(pwd.length>=20) score++;
    if(/[A-Z]/.test(pwd)) score++;
    if(/[a-z]/.test(pwd)) score++;
    if(/[0-9]/.test(pwd)) score++;
    if(/[^A-Za-z0-9]/.test(pwd)) score++;
    const fill=document.getElementById('strengthFill'), label=document.getElementById('strengthLabel');
    const levels=[{p:16,c:'#ff4444',t:'Very Weak'},{p:33,c:'#ff8800',t:'Weak'},{p:50,c:'#ffcc00',t:'Fair'},{p:66,c:'#88cc00',t:'Good'},{p:83,c:'#00cc66',t:'Strong'},{p:100,c:'#00ff88',t:'Very Strong'}];
    const l=levels[Math.min(score,5)];
    fill.style.width=l.p+'%'; fill.style.background=l.c; label.textContent=l.t; label.style.color=l.c;
  }
  document.getElementById('generateBtn').addEventListener('click',generate);
  document.getElementById('copyBtn').addEventListener('click',()=>{
    const pwd=document.getElementById('passwordDisplay').textContent;
    navigator.clipboard.writeText(pwd).then(()=>{ document.getElementById('copyBtn').textContent='Copied!'; setTimeout(()=>document.getElementById('copyBtn').textContent='Copy',2000); });
  });
  document.getElementById('multiBtn').addEventListener('click',()=>{
    const list=document.getElementById('multiList'); list.innerHTML='';
    for(let i=0;i<5;i++){
      const pwd=generate();
      const div=document.createElement('div'); div.className='multi-item'; div.textContent=pwd;
      div.addEventListener('click',()=>{ navigator.clipboard.writeText(pwd); div.textContent='✓ Copied! — '+pwd; setTimeout(()=>div.textContent=pwd,2000); });
      list.appendChild(div);
    }
    document.getElementById('multiSection').style.display='block';
  });
  generate();
</script>
</body>
</html>
